[app]
id = "aster.hifi"
name = "Aster 音乐"
description = "滑动切换播放、同步歌词和曲库，支持本地音乐与蓝牙音频。"
version = "0.4.28"
abi = "4.5.0"
abi_min = "4.5"
aot = true
optimize = "Os"
orientation = "portrait"
category = "tool"
stack = 16384
initial_memory = 1048576
max_memory = 2097152
heap = 524288
requires = ["display", "touch", "media-player"]
supported_boards = ["fakepod-s31", "osptek-p4-st7102"]
permissions = ["fs"]
sources = ["src/main.c", "src/lrc.c", "src/flac_lyrics.c", "src/cover.c", "src/cover_jpeg.c",
           "vendor/tjpgd/tjpgd.c", "src/paper.c", "src/paper_font.c", "src/lyric_layout.c", "src/shake.c"]
icon = "icon.bin"
assets = [
    "audio/demo.flac",
    "audio/demo.lrc",
    "art/moonlight.bmp",
    "text/gbk.bin",
    "text/paper-serif.bin",
    "text/paper-bold.bin",
    "text/paper-serif-OFL.txt",
    "text/paper-bold-OFL.txt",
]

[sdk]
target = "riscv"
