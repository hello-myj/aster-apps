[app]
id = "aster.goldminer"
name = "黄金矿工"
description = "摇钩拾金，重温旧日午后的闪光。"
version = "0.2.0"
abi = "4.2.0"
abi_min = "4.1"
aot = true
optimize = "Os"
orientation = "landscape"
category = "game"
initial_memory = 2097152
max_memory = 3145728
heap = 262144
stack = 32768
sources = ["port/platform.c", "port/game.c", "port/allocator.c", "port/wasi_adapter.c"]
requires = ["display", "touch", "filesystem", "audio-out", "audio-effects"]
permissions = ["fs"]
icon = "assets/icon.bin"
[sdk]
target = "xtensa"
[build]
includes = ["port"]
defines = ["OMF_HEAP_BYTES=1048576", "GOLDMINER_CACHE_BYTES=786432", "__wasi__=1"]
cflags = ["-flto", "-mbulk-memory", "-isystem", "artifacts/deps/wasi/include/wasm32-wasi", "-include", "port/native_compat.h", "-Wno-unused-parameter"]
ldflags = ["-flto", "-mbulk-memory", "artifacts/deps/libasterc.a", "artifacts/deps/libclang_builtins.a"]
