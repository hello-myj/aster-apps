[app]
id = "aster.openomf"
name = "OpenOMF"
description = "钢铁交锋，重返旧日擂台。"
version = "0.1.1"
icon = "assets/icon.bin"
abi = "4.1.0"
abi_min = "4.1"
aot = true
optimize = "Os"
